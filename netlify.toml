# Send a webmention to Bridgy Fed for each newly added, syndication-flagged
# post (see plugins/bridgy-webmention). Runs onSuccess, after the build.
[[plugins]]
  package = "/plugins/bridgy-webmention"

# Proxy committed Micropub uploads through the canonical domain.
#
# The Micropub receiver commits images into content/uploads/ and writes
# absolute photo URLs like https://<domain>/content/uploads/<file>. Astro's
# static build only publishes dist/, so content/ is never deployed and those
# URLs 404 for external consumers (RSS/h-feed readers, Bridgy Fed -> Mastodon/
# Bluesky). This transparent proxy (status = 200) serves the file straight from
# the GitHub repo the receiver commits to, with the URL staying on this domain.
[[redirects]]
  from = "/content/uploads/*"
  to = "https://raw.githubusercontent.com/samjstone/personal-site/main/content/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/host-meta*"
  to = "https://fed.brid.gy/.well-known/host-meta:splat"
  status = 302
[[redirects]]
  from = "/.well-known/webfinger*"
  to = "https://fed.brid.gy/.well-known/webfinger"
  status = 302

# Bluesky (ATProto) handle verification for the custom handle `hyperwolfie.com`.
# Bluesky fetches the plain-text DID from this path to confirm we own the domain.
# Served as a static file from public/.well-known/atproto-did; this header just
# guarantees the correct content-type.
[[headers]]
  for = "/.well-known/atproto-did"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
